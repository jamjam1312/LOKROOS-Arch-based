---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: "EFI"
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4" ]
allowManualPartitioning: true
defaultPartitionTableType: gpt
# Open the explicit disk/partition table instead of preselecting an erase
# operation. The user still has to choose mount points and confirm the summary.
initialPartitioningChoice: manual
initialSwapChoice: none
userSwapChoices: [ "none" ]
enableLuksAutomatedPartitioning: true
preCheckEncryption: false
luksGeneration: luks1
lvm:
  enable: false
requiredStorage: 20
