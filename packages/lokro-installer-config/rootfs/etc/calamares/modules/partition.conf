---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: "EFI"
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4" ]
allowManualPartitioning: true
defaultPartitionTableType: gpt
# Never detach the live source while Calamares clears stale target mounts.
# "ventoy" is Calamares' documented exception for a Ventoy-backed ISO.
essentialMounts: [ "live-*", "control", "ventoy" ]
# Show the guided Erase / Replace / Alongside choices and the manual editor,
# but deliberately preselect none of them. "Replace" lets the user choose one
# existing partition; Calamares then reformats only that explicitly selected
# partition as ext4 after the summary confirmation.
initialPartitioningChoice: none
initialSwapChoice: none
userSwapChoices: [ "none" ]
enableLuksAutomatedPartitioning: true
preCheckEncryption: false
luksGeneration: luks1
lvm:
  enable: false
requiredStorage: 20
