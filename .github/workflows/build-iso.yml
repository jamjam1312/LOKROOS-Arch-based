name: Build alpha ISO

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified artifacts as an alpha prerelease
        required: true
        type: boolean
        default: false
  push:
    branches:
      - 'codex/iso-smoke-*'
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: lokro-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build packages and ISO in Arch Linux
        run: |
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc 'pacman -Syu --noconfirm --needed archiso desktop-file-utils git gnupg jq nodejs python-yaml qemu-desktop edk2-ovmf rsync shellcheck sudo qt6-declarative kirigami plasma-workspace && make validate packages && make validate && make iso-offline iso-online checksums'
      - name: Enforce ISO size limit
        run: |
          for iso in out/*.iso; do
            size=$(stat -c %s "$iso")
            printf '%s: %s bytes\n' "$iso" "$size"
            test "$size" -le 4294967296
          done
      - name: Smoke boot BIOS and UEFI
        run: |
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base \
            bash -lc 'pacman -Syu --noconfirm --needed edk2-ovmf make qemu-desktop && make smoke-bios smoke-uefi'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lokro-os-alpha-metadata
          path: |
            out/SHA256SUMS
            out/ISO-PARTS-SHA256SUMS
            out/REASSEMBLE.md
            out/LOKRO_UPDATE_CHANNEL.json
            out/lokro-repo-*.tar.zst.sha256
            out/package-manifest-*.txt
            out/package-licenses-*.tsv
            out/resolved-packages-*.txt
            out/build-metadata.txt
            out/build-*.log
            out/THIRD_PARTY-NOTICES.md
            out/KNOWN_LIMITATIONS.md
            out/LICENSE-REFERENCES.md
            out/AI-DISCLOSURE.md
            out/SOURCE-PROVENANCE.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish alpha prerelease
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          tag="v${version}"
          shopt -s nullglob
          files=(out/*.iso.[0-9][0-9][0-9] out/ISO-PARTS-SHA256SUMS out/SHA256SUMS out/REASSEMBLE.md out/LOKRO_UPDATE_CHANNEL.json out/lokro-repo-*.tar.zst out/lokro-repo-*.tar.zst.sha256 out/package-manifest-*.txt out/package-licenses-*.tsv out/build-metadata.txt out/THIRD_PARTY-NOTICES.md out/KNOWN_LIMITATIONS.md out/LICENSE-REFERENCES.md out/AI-DISCLOSURE.md out/SOURCE-PROVENANCE.json)
          test "${#files[@]}" -gt 0
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --prerelease \
              --title "LOKRO OS ${version}" \
              --notes-file out/REASSEMBLE.md
          fi
